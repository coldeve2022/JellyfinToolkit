name: release

# 打 v* 标签即自动构建 Windows 包并创建 Release
#   用法： git tag v3.7.0 && git push origin v3.7.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/覆盖的标签（如 v3.7.0）"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 包
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: 标签与 version.py 一致性检查
        shell: bash
        run: |
          set -e
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          py_ver=$(python -c "import version; print(version.__version__)")
          echo "tag=$tag  version.py=$py_ver"
          if [ "v$py_ver" != "$tag" ]; then
            echo "::error::标签 $tag 与 version.py ($py_ver) 不一致，先改 version.py"
            exit 1
          fi

      # 这里**不重复跑测试**：tests workflow 已经在同一个提交上跑过全平台矩阵
      # （而且那边装了真 ffmpeg，这边没装 —— 环境不一致反而容易制造假问题，
      # 实测就是这一步跑了 30 分钟以上不结束）。
      # 产物本身由下一步 smoke_exe 真实启动验证，那才是"这个包能不能用"的关键。
      - name: 构建（图标 + 版本资源 + PyInstaller + zip + SHA256）
        run: python scripts/build_release.py --skip-tests

      - name: 验证打包产物真的能启动
        run: python tools/dev/smoke_exe.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinToolkit-win64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Jellyfin Toolkit ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载下面的 `JellyfinToolkit-*.zip`
            2. 解压到任意目录
            3. 双击 `JellyfinToolkit.exe`

            > 首次运行前请核对压缩包的 SHA256（见 Release 附件里的 `.sha256` 文件）。

            ## 系统要求

            - Windows 10/11（64 位）
            - FFmpeg / ffprobe（可选，但视频修复、转码、分集合并需要）
              下载后放到程序目录的 `bin/` 子目录，或在「设置 → FFmpeg 转码设置」里指定路径

            ## 数据位置

            `%APPDATA%\JellyfinToolkit\`
            想做成便携版：在程序目录里新建一个空的 `portable.txt`。

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
