name: release

# 打 v* 标签即自动构建 Windows 包并创建 Release
#   用法： git tag v3.7.0 && git push origin v3.7.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的新标签（已发布标签不可覆盖）"
        required: true

permissions:
  contents: write

jobs:
  validation:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  build-windows:
    name: 构建 Windows 包
    timeout-minutes: 60
    runs-on: windows-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: 安装真实 FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          echo "$env:ChocolateyInstall\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: 标签与 version.py 一致性检查
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          tag="$RELEASE_TAG"
          py_ver=$(python -c "import version; print(version.__version__)")
          echo "tag=$tag  version.py=$py_ver"
          if [ "v$py_ver" != "$tag" ]; then
            echo "::error::标签 $tag 与 version.py ($py_ver) 不一致，先改 version.py"
            exit 1
          fi

      - name: 构建（图标 + 版本资源 + PyInstaller + zip + SHA256）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_release.py

      - name: 验证打包产物真的能启动
        run: python tools/dev/smoke_exe.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinToolkit-win64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      # 把 CHANGELOG 里**本版本那一节**抽出来嵌进 Release 正文 ——
      # 用户第一眼就能看到这版改了什么，不必再点一次链接。
      - name: 生成 Release 正文（嵌入本次更新内容）
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          python scripts/release_notes.py --version "${tag#v}" --out release_body.md
          echo "---- 正文预览 ----"
          head -30 release_body.md

      - name: 创建不可覆盖的 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $releaseAssets = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object { $_.FullName })
          if ($releaseAssets.Count -lt 2) { throw 'Missing release artifacts' }
          gh release create $env:RELEASE_TAG --verify-tag --title "Jellyfin Toolkit $env:RELEASE_TAG" --notes-file release_body.md @releaseAssets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
