name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 隐私守卫：个人数据一旦进了 git，历史里就再也删不干净
  # ─────────────────────────────────────────────────────────────
  privacy-guard:
    name: 隐私守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认个人数据文件未被提交
        run: |
          set -e
          fail=0
          for f in config.json subtitle_state.json data smart.db trash_journal.db \
                   merge_archive_journal.json 喜好画像报表.csv portable.txt .workbuddy demo; do
            if [ -e "$f" ]; then
              echo "::error::不该提交的文件出现在仓库里: $f"
              fail=1
            fi
          done
          # 任何发布用的备份/日志产物
          if git ls-files | grep -E '(_backup_|报表|jellyfin_clean_backup_|app-error\.log)'; then
            echo "::error::仓库中出现了备份/个人报表类文件"
            fail=1
          fi
          exit $fail

      - name: 确认源码里没有本机个人路径
        run: |
          set -e
          # 排除 CI 配置自身（它列举了这些关键词）与文档目录
          hits=$(git grep -nI -E 'C:\\Users\\|/Users/[a-z]|迅雷|\\.workbuddy' \
                   -- '*.py' '*.vbs' '*.bat' '*.sh' '*.json' '*.toml' '*.yml' \
                   ':!CONTRIBUTING.md' ':!.github/workflows/tests.yml' \
                   ':!tests/test_portability.py' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::源码中发现本机个人路径"
            exit 1
          fi
          echo "OK"

      - name: 确认 .gitignore 覆盖了个人数据
        run: |
          set -e
          for pattern in config.json "data/" .venv "dist/" "__pycache__/" demo/; do
            grep -qF -- "$pattern" .gitignore || {
              echo "::error::.gitignore 缺少 $pattern"; exit 1; }
          done
          echo "OK"

      - name: 确认没有忘在源码里的绝对路径
        run: |
          set -e
          # 允许的例外：Windows 默认安装位置、示例、文档
          hits=$(git grep -nI -E '[A-Z]:[\\/]' -- '*.py' \
                   ':!tests/*' ':!tools/dev/*' ':!config.example.json' \
                 | grep -vE 'C:\\ProgramData|C:\\Program Files|C:\\Windows|C:\\ffmpeg|C:\\Media|C:\\Demo|C:\\data|C:\\fake|C:\\App' \
                 || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::发现可疑的硬编码绝对路径"
            exit 1
          fi
          echo "OK"

  # ─────────────────────────────────────────────────────────────
  # 测试：装**真 ffmpeg**，否则所有 ffmpeg 相关用例都会被 skip，等于没测
  # ─────────────────────────────────────────────────────────────
  test:
    name: 测试 (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装 Qt 运行库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxkbcommon0 \
                                  libdbus-1-3 libfontconfig1 fonts-noto-cjk

      # Windows/macOS/Linux 都用系统包管理器装真 ffmpeg
      - name: 安装 FFmpeg（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: 安装 FFmpeg（macOS）
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: 安装 FFmpeg（Windows）
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          echo "$env:ChocolateyInstall\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 环境自检（确认 ffmpeg 真的可用）
        run: python main.py --doctor

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
          # 测试期间把数据目录钉到临时路径，确保绝不写仓库
          JELLYFIN_TOOLKIT_DATA_DIR: ${{ runner.temp }}/jellyfin-toolkit-ci
        run: python -m pytest tests -q

      - name: 确认测试没有污染工作区
        shell: bash
        run: |
          set -e
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error::测试在仓库里留下了文件"
            exit 1
          fi
          echo "工作区干净 ✅"

  # ─────────────────────────────────────────────────────────────
  # 静态检查
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: ruff
        run: ruff check .
      - name: 所有文件都能编译
        run: python -m compileall -q ui utils workers automation tools tests main.py config.py version.py
