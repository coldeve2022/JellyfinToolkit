[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-toolkit"
version = "3.7.0"
description = "Jellyfin / Emby 影视库管理工具箱 — 库概览 / 喜好画像 / 打标 / 去重 / 字幕 / 修复 / 分集合并"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "coldeve2022" }]
keywords = ["jellyfin", "emby", "media-library", "pyside6", "ffmpeg", "gui", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = ["PySide6>=6.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/coldeve2022/JellyfinToolkit"
Source = "https://github.com/coldeve2022/JellyfinToolkit"
Issues = "https://github.com/coldeve2022/JellyfinToolkit/issues"
Changelog = "https://github.com/coldeve2022/JellyfinToolkit/blob/main/CHANGELOG.md"

[project.scripts]
jellyfin-toolkit = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "version", "auto_orchestrator", "auto_pipeline"]
packages = ["ui", "ui.pages", "utils", "workers", "automation"]

# ── pytest ──────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# 注意：只收 test_*.py / *_test.py。手动脚本放 tools/dev/，
# 别用 gui_smoke.py 这类"看着像测试"的名字 —— CI 永远不会跑它。
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ── ruff ────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git", ".venv", "build", "dist", "demo",
    "_backup_*", "docs/_shots",
]

[tool.ruff.lint]
# 只保留「能真的拦住 bug」的规则族，而不是全开。
#
# 原因：原先选了 E/F/W/I/UP/B/C4/SIM/PTH 九族，但对一份已经成型的代码库
# 会报出 480+ 条（大多是 PTH「请用 pathlib」、UP045「请用 X | None」这类
# 纯风格项）。CI 的 lint job 会在第一次运行就红，实际等于**没有静态检查**。
#
# 现在收敛到：
#   E4/E7/E9 —— 导入位置、语句写法、以及真正的语法/运行时错误
#   F        —— pyflakes：未定义名字(F821)、重复定义(F811)、未使用变量(F841)、
#                f-string 缺占位符(F541) 等
# 这几族恰好覆盖本仓库真实抓到过的缺陷（4 处按钮点击 NameError、
# 1 处调用不存在的私有方法、1 处循环变量遮蔽 dataclasses.field）。
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",    # 行长由 formatter 负责
    "E702",    # 分号写多条语句（存量代码大量使用，属风格）
    "E741",    # 易混变量名 l/I/O（存量代码里是循环里的单字母）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "B011", "SIM117"]
"tools/*" = ["E402", "PTH"]
"ui/pages/*" = ["C901", "PLR0912", "PLR0915"]
"utils/merge*.py" = ["C901"]
